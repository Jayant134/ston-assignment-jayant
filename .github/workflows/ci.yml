name: STON RN CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
      - run: npx eslint src/ --ext .js,.jsx,.ts,.tsx

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
      - run: npx jest --passWithNoTests --coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
      - run: npx expo export --platform android

  server:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
      - run: |
          npm run server &
          sleep 3
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/drives)
          echo "Status: $CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "401" ]

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, build, server]
    if: always()
    steps:
      - run: |
          echo "## STON RN CI Result" >> $GITHUB_STEP_SUMMARY
          echo "Lint: ${{ needs.lint.result }} | Test: ${{ needs.test.result }} | Build: ${{ needs.build.result }} | Server: ${{ needs.server.result }}" >> $GITHUB_STEP_SUMMARY
